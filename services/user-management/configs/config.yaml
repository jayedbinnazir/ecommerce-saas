user_service:
  host: 0.0.0.0
  port: "8080"
  mode: release

database:
  host: localhost
  port: "5432"
  name: user_management_db
  dbssl: false
  max_open_connections: 25
  max_idle_connections: 10
  connection_max_lifetime: 30m

redis:
  host: localhost
  port: "6379"

kafka:
  brokers:
    - localhost:9092

jwt:
  secret: "change-me-in-production"
  expires: 24h
  access_ttl: 15m
  refresh_ttl: 168h

auth:
  frontend_url: "http://localhost:3000"
  cookie_domain: ""
  cookie_secure: false
  google:
    client_id: ""
    client_secret: ""
    redirect_url: "http://localhost:8080/api/v1/auth/google/callback"
  facebook:
    client_id: ""
    client_secret: ""
    redirect_url: "http://localhost:8080/api/v1/auth/facebook/callback"

services:
  payment_service_url: "http://localhost:8086"
  payment_internal_key: ""
  mail_service_url: "http://localhost:8087"
  mail_internal_key: ""

internal_key: ""
