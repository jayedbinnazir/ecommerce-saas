server:
  host: 0.0.0.0
  port: "8080"
  mode: debug

database:
  host: postgres
  port: "5432"
  name: payment_db

kafka:
  brokers:
    - kafka:9092

jwt:
  secret: "change-this-in-development"

services:
  user_service_url: "http://user-management:8080"

# Leave stripe.secret_key empty to run the gateway in stub mode (card payments
# "succeed" instantly). Set PAYMENT_STRIPE_SECRET_KEY / _WEBHOOK_SECRET in
# .env.dev to use a real Stripe test account.
stripe:
  secret_key: ""
  webhook_secret: ""

internal_key: "dev-internal-key"
