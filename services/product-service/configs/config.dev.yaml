server:
  host: 0.0.0.0
  port: "8080"
  mode: debug

database:
  host: postgres
  port: "5432"
  name: product_db

kafka:
  brokers:
    - kafka:9092

jwt:
  secret: "change-this-in-development"

services:
  user_service_url: "http://user-management:8080"

s3:
  bucket: "product-images"
  region: "us-east-1"
  endpoint: "http://minio:9000"
  public_base_url: "http://localhost:9000/product-images"
  access_key_id: "minioadmin"
  secret_access_key: "minioadmin"
