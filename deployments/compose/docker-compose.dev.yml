services:

  nginx:
    image: nginx:alpine
    container_name: ecommerce-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - user-management

    networks:
      - ecommerce-network

  # ============================================================
  # USER MANAGEMENT
  # ============================================================
  user-management:
    build:
      context: ../../services/user-management
      dockerfile: docker/Dockerfile.dev

    container_name: user-management

    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV}

      # Server
      USER_SERVICE_HOST: ${USER_SERVICE_HOST}
      USER_SERVICE_PORT: ${USER_SERVICE_PORT}
      USER_SERVICE_MODE: ${USER_SERVICE_MODE}

      # Database
      USER_DB_HOST: ${USER_DB_HOST}
      USER_DB_PORT: ${USER_DB_PORT}
      USER_DB_NAME: ${USER_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # Redis
      USER_REDIS_HOST: ${USER_REDIS_HOST}
      USER_REDIS_PORT: ${USER_REDIS_PORT}

      # Kafka
      USER_KAFKA_BROKERS: ${USER_KAFKA_BROKERS}

      # JWT
      USER_JWT_SECRET: ${USER_JWT_SECRET}
      USER_JWT_EXPIRES: ${USER_JWT_EXPIRES}
      USER_JWT_ACCESS_TTL: ${USER_JWT_ACCESS_TTL}
      USER_JWT_REFRESH_TTL: ${USER_JWT_REFRESH_TTL}

      # payment-service (subscription gate for store creation)
      USER_PAYMENT_SERVICE_URL: ${USER_PAYMENT_SERVICE_URL}
      USER_PAYMENT_INTERNAL_KEY: ${USER_PAYMENT_INTERNAL_KEY}
      # key OTHER services use to call user-management's /api/v1/internal (e.g. mail-service)
      USER_INTERNAL_KEY: ${USER_INTERNAL_KEY}

      # Auth cookies + OAuth (Google / Facebook) — blank client id/secret = provider disabled
      USER_AUTH_FRONTEND_URL: ${USER_AUTH_FRONTEND_URL}
      USER_AUTH_COOKIE_DOMAIN: ${USER_AUTH_COOKIE_DOMAIN}
      USER_AUTH_COOKIE_SECURE: ${USER_AUTH_COOKIE_SECURE}
      USER_AUTH_GOOGLE_CLIENT_ID: ${USER_AUTH_GOOGLE_CLIENT_ID}
      USER_AUTH_GOOGLE_CLIENT_SECRET: ${USER_AUTH_GOOGLE_CLIENT_SECRET}
      USER_AUTH_GOOGLE_REDIRECT_URL: ${USER_AUTH_GOOGLE_REDIRECT_URL}
      USER_AUTH_FACEBOOK_CLIENT_ID: ${USER_AUTH_FACEBOOK_CLIENT_ID}
      USER_AUTH_FACEBOOK_CLIENT_SECRET: ${USER_AUTH_FACEBOOK_CLIENT_SECRET}
      USER_AUTH_FACEBOOK_REDIRECT_URL: ${USER_AUTH_FACEBOOK_REDIRECT_URL}

    volumes:
      - ../../services/user-management:/app

    ports:
      - "8081:8080"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      kafka:
        condition: service_healthy

    networks:
      - ecommerce-network


  # ============================================================
  # PRODUCT
  # ============================================================
  product-service:
    build:
      context: ../../services/product-service
      dockerfile: docker/Dockerfile.dev

    container_name: product-service

    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV}

      PRODUCT_SERVICE_HOST: ${PRODUCT_SERVICE_HOST}
      PRODUCT_SERVICE_PORT: ${PRODUCT_SERVICE_PORT}
      PRODUCT_SERVICE_MODE: ${PRODUCT_SERVICE_MODE}

      PRODUCT_DB_HOST: ${PRODUCT_DB_HOST}
      PRODUCT_DB_PORT: ${PRODUCT_DB_PORT}
      PRODUCT_DB_NAME: ${PRODUCT_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      PRODUCT_KAFKA_BROKERS: ${PRODUCT_KAFKA_BROKERS}

      # must match user-management's USER_JWT_SECRET
      PRODUCT_JWT_SECRET: ${PRODUCT_JWT_SECRET}
      PRODUCT_USER_SERVICE_URL: ${PRODUCT_USER_SERVICE_URL}

      PRODUCT_S3_BUCKET: ${PRODUCT_S3_BUCKET}
      PRODUCT_S3_REGION: ${PRODUCT_S3_REGION}
      PRODUCT_S3_ENDPOINT: ${PRODUCT_S3_ENDPOINT}
      PRODUCT_S3_PUBLIC_BASE_URL: ${PRODUCT_S3_PUBLIC_BASE_URL}
      PRODUCT_S3_ACCESS_KEY_ID: ${PRODUCT_S3_ACCESS_KEY_ID}
      PRODUCT_S3_SECRET_ACCESS_KEY: ${PRODUCT_S3_SECRET_ACCESS_KEY}

    volumes:
      - ../../services/product-service:/app

    ports:
      - "8082:8080"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      user-management:
        condition: service_started

    networks:
      - ecommerce-network


  # ============================================================
  # INVENTORY
  # ============================================================
  inventory-service:
    build:
      context: ../../services/inventory-service
      dockerfile: docker/Dockerfile.dev

    container_name: inventory-service

    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV}

      INVENTORY_SERVICE_HOST: ${INVENTORY_SERVICE_HOST}
      INVENTORY_SERVICE_PORT: ${INVENTORY_SERVICE_PORT}
      INVENTORY_SERVICE_MODE: ${INVENTORY_SERVICE_MODE}

      INVENTORY_DB_HOST: ${INVENTORY_DB_HOST}
      INVENTORY_DB_PORT: ${INVENTORY_DB_PORT}
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      INVENTORY_KAFKA_BROKERS: ${INVENTORY_KAFKA_BROKERS}

      # must match user-management's USER_JWT_SECRET
      INVENTORY_JWT_SECRET: ${INVENTORY_JWT_SECRET}
      INVENTORY_USER_SERVICE_URL: ${INVENTORY_USER_SERVICE_URL}
      INVENTORY_INTERNAL_KEY: ${INVENTORY_INTERNAL_KEY}

    volumes:
      - ../../services/inventory-service:/app

    ports:
      - "8083:8080"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-management:
        condition: service_started

    networks:
      - ecommerce-network


  # ============================================================
  # CART
  # ============================================================
  cart-service:
    build:
      context: ../../services/cart-service
      dockerfile: docker/Dockerfile.dev

    container_name: cart-service

    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV}

      CART_SERVICE_HOST: ${CART_SERVICE_HOST}
      CART_SERVICE_PORT: ${CART_SERVICE_PORT}
      CART_SERVICE_MODE: ${CART_SERVICE_MODE}

      CART_DB_HOST: ${CART_DB_HOST}
      CART_DB_PORT: ${CART_DB_PORT}
      CART_DB_NAME: ${CART_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      CART_KAFKA_BROKERS: ${CART_KAFKA_BROKERS}

      # must match user-management's USER_JWT_SECRET
      CART_JWT_SECRET: ${CART_JWT_SECRET}
      CART_USER_SERVICE_URL: ${CART_USER_SERVICE_URL}
      CART_PRODUCT_SERVICE_URL: ${CART_PRODUCT_SERVICE_URL}
      CART_INVENTORY_SERVICE_URL: ${CART_INVENTORY_SERVICE_URL}

    volumes:
      - ../../services/cart-service:/app

    ports:
      - "8084:8080"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-management:
        condition: service_started
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started

    networks:
      - ecommerce-network


  # ============================================================
  # ORDER
  # ============================================================
  order-service:
    build:
      context: ../../services/order-service
      dockerfile: docker/Dockerfile.dev

    container_name: order-service

    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV}

      ORDER_SERVICE_HOST: ${ORDER_SERVICE_HOST}
      ORDER_SERVICE_PORT: ${ORDER_SERVICE_PORT}
      ORDER_SERVICE_MODE: ${ORDER_SERVICE_MODE}

      ORDER_DB_HOST: ${ORDER_DB_HOST}
      ORDER_DB_PORT: ${ORDER_DB_PORT}
      ORDER_DB_NAME: ${ORDER_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      ORDER_KAFKA_BROKERS: ${ORDER_KAFKA_BROKERS}

      # must match user-management's USER_JWT_SECRET
      ORDER_JWT_SECRET: ${ORDER_JWT_SECRET}
      ORDER_USER_SERVICE_URL: ${ORDER_USER_SERVICE_URL}
      ORDER_CART_SERVICE_URL: ${ORDER_CART_SERVICE_URL}
      ORDER_INVENTORY_SERVICE_URL: ${ORDER_INVENTORY_SERVICE_URL}
      # must match inventory-service's INVENTORY_INTERNAL_KEY
      ORDER_INVENTORY_INTERNAL_KEY: ${ORDER_INVENTORY_INTERNAL_KEY}
      ORDER_PAYMENT_SERVICE_URL: ${ORDER_PAYMENT_SERVICE_URL}
      # must match payment-service's PAYMENT_INTERNAL_KEY
      ORDER_PAYMENT_INTERNAL_KEY: ${ORDER_PAYMENT_INTERNAL_KEY}
      # order-lifecycle events go to Kafka (order-events topic); ORDER_KAFKA_BROKERS is set above

    volumes:
      - ../../services/order-service:/app

    ports:
      - "8085:8080"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-management:
        condition: service_started
      cart-service:
        condition: service_started
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started

    networks:
      - ecommerce-network


  # ============================================================
  # PAYMENT
  # ============================================================
  payment-service:
    build:
      context: ../../services/payment-service
      dockerfile: docker/Dockerfile.dev

    container_name: payment-service

    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV}

      PAYMENT_SERVICE_HOST: ${PAYMENT_SERVICE_HOST}
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT}
      PAYMENT_SERVICE_MODE: ${PAYMENT_SERVICE_MODE}

      PAYMENT_DB_HOST: ${PAYMENT_DB_HOST}
      PAYMENT_DB_PORT: ${PAYMENT_DB_PORT}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      PAYMENT_KAFKA_BROKERS: ${PAYMENT_KAFKA_BROKERS}

      # must match user-management's USER_JWT_SECRET
      PAYMENT_JWT_SECRET: ${PAYMENT_JWT_SECRET}
      PAYMENT_USER_SERVICE_URL: ${PAYMENT_USER_SERVICE_URL}
      PAYMENT_INTERNAL_KEY: ${PAYMENT_INTERNAL_KEY}

      PAYMENT_STRIPE_SECRET_KEY: ${PAYMENT_STRIPE_SECRET_KEY}
      PAYMENT_STRIPE_WEBHOOK_SECRET: ${PAYMENT_STRIPE_WEBHOOK_SECRET}

    volumes:
      - ../../services/payment-service:/app

    ports:
      - "8086:8080"

    # No depends_on user-management: payment-service only calls it for authz on
    # manager reads (well after boot), and user-management calls payment-service
    # for the store-creation gate — declaring both ways would be a cycle.
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - ecommerce-network


  # ============================================================
  # MAIL
  # ============================================================
  mail-service:
    build:
      context: ../../services/mail-service
      dockerfile: docker/Dockerfile.dev

    container_name: mail-service
    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV}
      MAIL_SERVICE_HOST: ${MAIL_SERVICE_HOST}
      MAIL_SERVICE_PORT: ${MAIL_SERVICE_PORT}
      MAIL_SERVICE_MODE: ${MAIL_SERVICE_MODE}
      MAIL_DB_HOST: ${MAIL_DB_HOST}
      MAIL_DB_PORT: ${MAIL_DB_PORT}
      MAIL_DB_NAME: ${MAIL_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_KAFKA_BROKERS: ${MAIL_KAFKA_BROKERS}
      MAIL_INTERNAL_KEY: ${MAIL_INTERNAL_KEY}
      # resolve recipient name + email off a Kafka event
      MAIL_USER_SERVICE_URL: ${MAIL_USER_SERVICE_URL}
      MAIL_USER_INTERNAL_KEY: ${MAIL_USER_INTERNAL_KEY}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD}
      MAIL_SMTP_FROM: ${MAIL_SMTP_FROM}

    volumes:
      - ../../services/mail-service:/app
    ports:
      - "8087:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-management:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - ecommerce-network


  # ============================================================
  # MAILPIT — local SMTP sink + inbox UI  (http://localhost:8025)
  # mail-service delivers here in dev; nothing leaves the machine.
  # ============================================================
  mailpit:
    image: axllent/mailpit:latest

    container_name: ecommerce-mailpit

    restart: unless-stopped

    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP

    # No SMTP auth configured — the mail-service client (net/smtp) then sends
    # without AUTH, which is what we want over a plaintext dev link.

    networks:
      - ecommerce-network


  # ============================================================
  # NOTIFICATION
  # ============================================================
  notification-service:
    build:
      context: ../../services/notification-service
      dockerfile: docker/Dockerfile.dev

    container_name: notification-service
    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV}
      NOTIFICATION_SERVICE_HOST: ${NOTIFICATION_SERVICE_HOST}
      NOTIFICATION_SERVICE_PORT: ${NOTIFICATION_SERVICE_PORT}
      NOTIFICATION_SERVICE_MODE: ${NOTIFICATION_SERVICE_MODE}
      NOTIFICATION_DB_HOST: ${NOTIFICATION_DB_HOST}
      NOTIFICATION_DB_PORT: ${NOTIFICATION_DB_PORT}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NOTIFICATION_KAFKA_BROKERS: ${NOTIFICATION_KAFKA_BROKERS}
      # must match user-management's USER_JWT_SECRET
      NOTIFICATION_JWT_SECRET: ${NOTIFICATION_JWT_SECRET}
      NOTIFICATION_USER_SERVICE_URL: ${NOTIFICATION_USER_SERVICE_URL}
      NOTIFICATION_MAIL_SERVICE_URL: ${NOTIFICATION_MAIL_SERVICE_URL}
      NOTIFICATION_MAIL_INTERNAL_KEY: ${NOTIFICATION_MAIL_INTERNAL_KEY}
      NOTIFICATION_INTERNAL_KEY: ${NOTIFICATION_INTERNAL_KEY}

    volumes:
      - ../../services/notification-service:/app
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mail-service:
        condition: service_started
      user-management:
        condition: service_started
    networks:
      - ecommerce-network


  # ============================================================
  # MINIO (S3-compatible object storage for dev)
  # ============================================================
  minio:
    image: minio/minio:latest

    container_name: ecommerce-minio

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console

    volumes:
      - minio-data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - ecommerce-network


  # one-shot: create the product-images bucket and make it publicly readable
  minio-setup:
    image: minio/mc:latest

    container_name: ecommerce-minio-setup

    depends_on:
      minio:
        condition: service_healthy

    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${PRODUCT_S3_BUCKET} &&
      mc anonymous set download local/${PRODUCT_S3_BUCKET}
      "

    networks:
      - ecommerce-network


  # ============================================================
  # POSTGRES
  # ============================================================
  postgres:
    image: postgres:17-alpine

    container_name: ecommerce-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres

    ports:
      # host 5433 -> container 5432 (host 5432 is often taken by a native
      # PostgreSQL install). Services talk to "postgres:5432" over the compose
      # network and are unaffected.
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - ecommerce-network


  # ============================================================
  # REDIS
  # ============================================================
  redis:
    image: redis:8-alpine

    container_name: ecommerce-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - ecommerce-network


  # ============================================================
  # KAFKA
  # ============================================================
  kafka:
    image: apache/kafka:4.3.1

    container_name: ecommerce-kafka

    restart: unless-stopped

    ports:
      - "9094:9094"

    environment:

      # KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listeners
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Single-node development
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # dev: let producers create order-events / payment-events on first publish
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    networks:
      - ecommerce-network


  # ============================================================
  # KAFKA UI — browse topics, messages, consumer groups
  # http://localhost:8090
  # ============================================================
  kafka-ui:
    image: kafbat/kafka-ui:latest

    container_name: ecommerce-kafka-ui

    restart: unless-stopped

    ports:
      - "8090:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: ecommerce-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - ecommerce-network


# ==============================================================
# NETWORK
# ==============================================================
networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge


# ==============================================================
# VOLUMES
# ==============================================================
volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data: