events {}

http {

    # ------------------------------------------------------------
    # USER MANAGEMENT
    # ------------------------------------------------------------
    upstream user_management {
        server user-management:8080;
    }

    upstream product_service {
        server product-service:8080;
    }

    upstream inventory_service {
        server inventory-service:8080;
    }

    upstream cart_service {
        server cart-service:8080;
    }

    upstream order_service {
        server order-service:8080;
    }

    upstream payment_service {
        server payment-service:8080;
    }

    upstream notification_service {
        server notification-service:8080;
    }


    # ------------------------------------------------------------
    # SERVER
    # ------------------------------------------------------------
    server {

        listen 80;

        server_name localhost;

        # --------------------------------------------------------
        # Health check
        # --------------------------------------------------------
        location /health {
            proxy_pass http://user_management;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # --------------------------------------------------------
        # User Management API
        # --------------------------------------------------------
        location /api/users/ {
            proxy_pass http://user_management;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # --------------------------------------------------------
        # Auth API
        # --------------------------------------------------------
        location /api/auth/ {
            proxy_pass http://user_management;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # --------------------------------------------------------
        # Role API
        # --------------------------------------------------------
        location /api/roles/ {
            proxy_pass http://user_management;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # --------------------------------------------------------
        # Product API — /api/v1/tenants/<id>/{products,catalog,categories}...
        # (user-management keeps /api/v1/tenants/<id>/members)
        # --------------------------------------------------------
        location ~ "^/api/v1/tenants/[0-9a-fA-F-]+/(products|catalog|categories)" {
            proxy_pass http://product_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # --------------------------------------------------------
        # Inventory API — /api/v1/tenants/<id>/{inventory,stock}...
        # --------------------------------------------------------
        location ~ "^/api/v1/tenants/[0-9a-fA-F-]+/(inventory|stock)" {
            proxy_pass http://inventory_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # --------------------------------------------------------
        # Cart API — /api/v1/tenants/<id>/cart...
        # --------------------------------------------------------
        location ~ "^/api/v1/tenants/[0-9a-fA-F-]+/cart" {
            proxy_pass http://cart_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # --------------------------------------------------------
        # Order API — /api/v1/tenants/<id>/{orders, shipping-rates, coupons,
        #             coupon-check, tax-config}...
        # (inventory-service's /api/v1/internal/... is NOT exposed here)
        # --------------------------------------------------------
        location ~ "^/api/v1/tenants/[0-9a-fA-F-]+/(orders|returns|shipping-rates|coupons|coupon-check|tax-config)" {
            proxy_pass http://order_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # --------------------------------------------------------
        # Payment API — plans, subscriptions, per-order payments, Stripe webhook.
        # /api/v1/internal/... is NOT exposed here.
        # --------------------------------------------------------
        location ~ "^/api/v1/(plans|subscription|webhooks/stripe)" {
            proxy_pass http://payment_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ "^/api/v1/tenants/[0-9a-fA-F-]+/payments" {
            proxy_pass http://payment_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # --------------------------------------------------------
        # Notification API — the signed-in user's in-app notifications.
        # mail-service has no gateway route (internal only).
        # --------------------------------------------------------
        location ~ "^/api/v1/notifications" {
            proxy_pass http://notification_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}